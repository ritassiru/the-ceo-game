<style>
:root {
  --bg: #F6F0E6;
  --panel: #FFFFFF;
  --ink: #2B1721;
  --muted: #6E5C63;
  --berry: #6D2E46;
  --rose: #A26769;
  --cream: #ECE2D0;
  --line: #D9CBBE;
  --cash: #3E8E6B;
  --rep: #C08A2E;
  --bad: #B0413E;
  --scene: #E9DDCB;
  --scene-2: #DCCBB4;
  --btn-text: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1318; --panel: #2A1C23; --ink: #F1E7EA; --muted: #BFA9B1;
    --berry: #C77A98; --rose: #D19A9C; --cream: #3A2830; --line: #4A3540;
    --cash: #62B891; --rep: #E0AE55; --bad: #E07571;
    --scene: #33232B; --scene-2: #2B1D24; --btn-text: #1E1318;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1318; --panel: #2A1C23; --ink: #F1E7EA; --muted: #BFA9B1;
  --berry: #C77A98; --rose: #D19A9C; --cream: #3A2830; --line: #4A3540;
  --cash: #62B891; --rep: #E0AE55; --bad: #E07571;
  --scene: #33232B; --scene-2: #2B1D24; --btn-text: #1E1318;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 1.125rem; line-height: 1.5;
}
/* tamanho do texto (configurações): tudo em rem acompanha */
:root[data-size="lg"] { font-size: 112.5%; }
:root[data-size="xl"] { font-size: 125%; }
.wrap { max-width: 540px; margin: 0 auto; padding: 16px 16px 32px; }
h1, h2, .who-name, .brand {
  font-family: "Fraunces", Georgia, "Times New Roman", serif;
  font-weight: 800; letter-spacing: -0.01em;
}
h1 { font-size: 2.3rem; line-height: 1.05; margin: 0 0 8px; color: var(--berry); }
h2 { font-size: 1.7rem; line-height: 1.1; margin: 0 0 10px; color: var(--berry); }
p { margin: 0 0 12px; }
.hint { color: var(--muted); font-size: 0.95rem; }

/* ---------- top bar + gauges ---------- */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.brand { font-size: 1.25rem; color: var(--berry); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step { color: var(--muted); font-size: 0.95rem; white-space: nowrap; }
.top-r { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.gear {
  flex: none; width: 40px; height: 40px; padding: 0; display: grid; place-items: center; cursor: pointer;
  color: var(--berry); background: none; border: 1.5px solid var(--line); border-radius: 999px;
}
.gear svg { width: 22px; height: 22px; }
.gear:hover { border-color: var(--rose); }
.gear:focus-visible { outline: 3px solid var(--rep); outline-offset: 2px; }
.no-gloss .gloss { text-decoration: none; cursor: inherit; pointer-events: none; }

/* ---------- settings ---------- */
#settings {
  position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
  padding: 16px; background: rgba(20, 10, 15, 0.55); overflow-y: auto;
}
.sheet {
  width: 100%; max-width: 440px; margin: auto; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px 16px;
}
.sheet h2 span { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; font-weight: 400; font-size: 1rem; color: var(--muted); letter-spacing: 0; }
.st-g { margin-bottom: 14px; }
.st-h { font-size: 0.88rem; color: var(--muted); margin: -2px 0 6px; }
.sheet .chip[aria-pressed="true"] b::before { content: "✓ "; color: var(--berry); }
.btn span { font-weight: 400; }
.gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.gauge { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 10px; position: relative; }
.g-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.95rem; margin-bottom: 6px; }
.g-row b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.track { height: 12px; background: var(--cream); border-radius: 6px; overflow: hidden; }
.fill { height: 100%; border-radius: 6px; transition: width 700ms cubic-bezier(.2,.8,.2,1); }
.gauge.cash .fill { background: var(--cash); }
.gauge.rep .fill { background: var(--rep); }
.delta {
  position: absolute; right: 10px; top: -14px; font-weight: 700; font-size: 1rem;
  padding: 1px 8px; border-radius: 999px; background: var(--panel); border: 1px solid currentColor;
  animation: pop 1600ms ease-out forwards;
}
.delta.up { color: var(--cash); } .delta.down { color: var(--bad); }
@keyframes pop { 0% { opacity: 0; transform: translateY(8px) scale(.8); } 15% { opacity: 1; transform: translateY(0) scale(1.08); } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }

/* ---------- scene + dialogue ---------- */
.scene {
  position: relative; height: 210px; border-radius: 14px 14px 0 0; overflow: hidden;
  background: linear-gradient(var(--scene) 0 72%, var(--scene-2) 72% 100%);
  border: 1px solid var(--line); border-bottom: 0;
}
.scene .window { position: absolute; left: 18px; top: 18px; width: 92px; height: 70px; border: 5px solid var(--panel); border-radius: 4px; background: #BFD6E0; opacity: .8; }
.scene .window::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--panel); }
.scene .plant { position: absolute; right: 22px; bottom: 58px; }
.scene svg.avatar { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 190px; height: 190px; }
.box {
  background: var(--panel); border: 1px solid var(--line); border-radius: 0 0 14px 14px;
  padding: 14px 16px 16px; min-height: 150px;
}
.who { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.who-name { font-size: 1.3rem; color: var(--berry); }
.who-role { color: var(--muted); font-size: 0.95rem; }
.line { font-size: 1.12rem; }

.choices { display: grid; gap: 10px; margin-top: 14px; }
button { font: inherit; }
.btn {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: 14px 16px; border-radius: 12px; font-size: 1.08rem; font-weight: 700;
  background: var(--berry); color: var(--btn-text); border: 2px solid var(--berry);
}
.btn.alt { background: var(--panel); color: var(--berry); }
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, .gloss:focus-visible { outline: 3px solid var(--rep); outline-offset: 2px; }
.btn.center { text-align: center; }

/* ---------- glossary ---------- */
.gloss {
  background: none; border: 0; padding: 0; margin: 0; cursor: pointer; color: inherit;
  font: inherit; text-decoration: underline dotted var(--rose); text-decoration-thickness: 2px; text-underline-offset: 3px;
}
#tip {
  position: absolute; z-index: 20; max-width: 300px; pointer-events: none; display: none;
  background: var(--ink); color: var(--bg); font-size: 0.95rem; padding: 6px 10px; border-radius: 8px;
}
#tip.on { display: block; }
.gloss.verb { text-decoration-style: dashed; text-decoration-color: var(--berry); }
/* nível Beginner (A1): sublinhado mais leve, para não pesar o texto */
.gloss.a1 { text-decoration-thickness: 1.5px; text-decoration-color: var(--muted); }
:root:not(.gloss-a1) .gloss.a1 { text-decoration: none; cursor: inherit; pointer-events: none; }
.opt-pt { display: none; font-weight: 400; font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
.gloss-a1 .opt-pt { display: block; }
#tip .vt { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 12px; }
#tip .vc { padding: 2px 6px; border-radius: 6px; border: 2px solid transparent; }
#tip .vc.on { border-color: var(--rep); }
#tip .vc span { display: block; font-size: 0.72rem; opacity: 0.8; }
#tip .vc b { font-size: 1.02rem; }
#tip .vpt { margin-top: 6px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; margin-bottom: 14px; }
label.lbl { display: block; font-weight: 700; margin-bottom: 6px; }
input[type=text], textarea {
  width: 100%; font: inherit; font-size: 1.05rem; color: var(--ink); background: var(--bg);

}

.lb-d { font-size: 0.92rem; }
.emap { display: grid; gap: 6px; margin-bottom: 4px; }
.erow { display: grid; grid-template-columns: 88px repeat(3, 1fr); gap: 6px; align-items: stretch; }
.etier { font-size: 0.82rem; font-weight: 700; align-self: center; line-height: 1.2; }
.etier span { display: block; font-size: 0.75rem; }
.ecell { border: 2px solid var(--line); border-radius: 10px; padding: 6px 4px; text-align: center; background: var(--panel); display: grid; gap: 2px; }
.ecell .ee { font-size: 1.35rem; line-height: 1; }
.ecell .en { font-size: 0.72rem; line-height: 1.15; }
.ecell.unk { color: var(--muted); border-style: dashed; background: transparent; }

.history { list-style: none; padding: 0; margin: 0; }

.kw b { display: block; font-size: 1.02rem; }

.past .lb-t { margin-top: 0; }

.past-best span { color: var(--muted); font-size: 0.92rem; }
.past-list { list-style: none; padding: 0; margin: 0 0 6px; }
.past-list li { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }

.own { font-size: 0.92rem; color: var(--muted); margin: 6px 0 0; padding-left: 10px; border-left: 3px solid var(--rep); }
.help-rule { margin-bottom: 14px; }
.done { font-weight: 700; color: var(--cash); margin: 12px 0 0; }
.pv-bar {

const VERB = new Map();
(function buildVerbs() {
  const NO_BASE = new Set(["have", "do"]);          // auxiliares: só o passado ganha glossário
  const DOUBLE = new Set(["get", "run", "win", "put", "cut", "set", "let", "begin", "sit", "forget"]);
  const sForm = b => /(s|sh|ch|x|o)$/.test(b) ? b + "es" : /[^aeiou]y$/.test(b) ? b.slice(0, -1) + "ies" : b + "s";
  const ing = b => (b === "be" || b === "see") ? b + "ing"
    : DOUBLE.has(b) ? b + b.slice(-1) + "ing"
    : /ie$/.test(b) ? b.slice(0, -2) + "ying"
    : /[^e]e$/.test(b) ? b.slice(0, -1) + "ing" : b + "ing";
  const add = (k, i, col) => {
    if (!VERB.has(k)) VERB.set(k, { i, cols: [] });
    if (col !== null && !VERB.get(k).cols.includes(col)) VERB.get(k).cols.push(col);
  };
  IRREG.forEach(([b, p, pp], i) => {
    if (!NO_BASE.has(b)) { add(b, i, 0); if (b !== "be") add(sForm(b), i, 0); add(ing(b), i, null); }
    p.split(" / ").forEach(f => add(f, i, 1));
    pp.split(" / ").forEach(f => add(f, i, 2));
  });
  const idx = b => IRREG.findIndex(v => v[0] === b);
  [["didn't", "do"], ["wasn't", "be"], ["weren't", "be"], ["hadn't", "have"]].forEach(([k, b]) => add(k, idx(b), 1));
})();

/* ---------------- helpers ---------------- */
const $ = (sel) => document.querySelector(sel);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function verbWrap(plain) {
  // palavras em posições ímpares do split são tokens; o resto é pontuação/espaço
  return plain.split(/([A-Za-z]+(?:['’][A-Za-z]+)?)/).map((part, i) => {
    if (i % 2 === 0) return esc(part);
    const key = part.toLowerCase().replace("’", "'");
    const v = VERB.get(key);
    if (v) return `<button type="button" class="gloss verb" data-v="${v.i}" data-c="${v.cols.join(",")}">${esc(part)}</button>`;
    // nível Beginner: quase todas as palavras (só aparecem com esse nível ligado)
    const a = A1[key];
    if (!a) return esc(part);
    const [base, pt] = a.includes("|") ? a.split("|") : ["", a];
    return `<button type="button" class="gloss a1" data-pt="${esc(pt)}"${base ? ` data-base="${esc(base)}"` : ""}>${esc(part)}</button>`;
  }).join("");
}
function rich(text) {
  // segmentos: [[palavra|tradução]] (glossário comum), {name} (nome da startup) e texto comum (verbos irregulares)
  return text.split(/(\[\[[^\]]+\]\]|\{name\})/).map(seg => {
    const g = seg.match(/^\[\[([^|\]]+)\|([^\]]+)\]\]$/);
    if (g) return `<button type="button" class="gloss" data-pt="${esc(g[2])}">${esc(g[1])}</button>`;
    if (seg === "{name}") return `<b>${esc(state.name)}</b>`;
    return verbWrap(seg);
  }).join("");
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clamp = (v) => Math.max(0, Math.min(100, v));

function newGame(keepName) {

function outcome() {
  const c = state.cash, r = state.rep;
  if (c <= 0) return "bankrupt";
  if (r < P.R0) return "users_left";
  if (c < P.C0) return "sold";
  if (r >= P.R2 && c >= P.C3) return "unicorn";
  if (r >= P.R1 && c >= P.C2) return "tookoff";
  if (r >= P.R1) return "rising";
  if (c >= P.C4) return "money";
  if (c < P.C5 || r < P.R3) return "thread";
  return "stuck";
}

function screenDecision() {
  const d = state.deck[state.idx];
  const p = PEOPLE[d.who];
  const order = shuffle(["a", "b"]);   // posição dos botões muda a cada decisão
  $("#app").innerHTML = topHTML(`Decision ${state.idx + 1} of ${ROUNDS}`) + gaugesHTML() + sceneHTML(d.who, "talk") + `

      </div>
    </div>`;
  document.querySelectorAll(".choices .btn").forEach(b => b.onclick = () => choose(b.dataset.k));
}

function choose(k) {
  const d = state.deck[state.idx];
  const opt = d[k], other = d[k === "a" ? "b" : "a"];
  const before = { cash: state.cash, rep: state.rep };
  state.cash = clamp(state.cash + opt.cash);
  state.rep = clamp(state.rep + opt.rep);
  state.history.push({ chose: opt.label, other: other.label, choseP: [opt.phrase, opt.phrasePt], otherP: [other.phrase, other.phrasePt],
                       dc: state.cash - before.cash, dr: state.rep - before.rep });
  const net = (state.cash - before.cash) + (state.rep - before.rep);
  const broke = state.cash <= 0;
  const last = state.idx === ROUNDS - 1;

  const btnText = broke ? "See what happened" : last ? "See the final result" : "Next decision";
  $("#app").innerHTML = topHTML(`Decision ${state.idx + 1} of ${ROUNDS}`) + gaugesHTML() + sceneHTML(d.who, net >= 0 ? "happy" : "worried") + `
    <div class="box">
      <div class="who"><span class="who-name">What happened</span><span class="who-role">you chose: ${esc(opt.label)}</span></div>
      <p class="line">${rich(opt.result)}</p>${sayButton(opt.result)}
      ${broke ? `<p class="line"><b>${esc(state.name)} has no money left.</b></p>` : ""}
      <div class="choices"><button class="btn center" id="next">${btnText}</button></div>
    </div>`;
  // animação dos medidores: começa no valor antigo e anda até o novo
  animateGauge("cash", before.cash, state.cash);
  animateGauge("rep", before.rep, state.rep);
  $("#next").onclick = () => {
    if (broke || last) { state.ended = outcome(); screenEnding(); }
    else { state.idx++; screenDecision(); }
  };
}

function animateGauge(key, from, to) {
  const f = $("#f-" + key), v = $("#v-" + key), g = $("#g-" + key);
  f.style.width = from + "%"; v.textContent = from;
  requestAnimationFrame(() => requestAnimationFrame(() => { f.style.width = to + "%"; v.textContent = to; }));
  const diff = to - from;
  if (diff !== 0) {
    const chip = document.createElement("span");
    chip.className = "delta " + (diff > 0 ? "up" : "down");
    chip.textContent = (diff > 0 ? "+" : "−") + Math.abs(diff);
    g.appendChild(chip);
  }
}

function fmtDelta(h) {
  const part = (v, icon) => v ? `${v > 0 ? "+" : "−"}${Math.abs(v)} ${icon}` : "";
  return [part(h.dc, "💰"), part(h.dr, "⭐")].filter(Boolean).join("  ") || "no change";
}

function lookingBack() {
  const hs = state.history, k = state.ended;
  if (!hs.length) return "";
  // o medidor que afundou (ou sustentou) esta empresa decide o que conta como erro
  const focus = ["bankrupt", "sold", "rising"].includes(k) ? "cash"
              : ["users_left", "money"].includes(k) ? "rep"
              : k === "thread" ? (state.cash < P.C5 ? "cash" : "rep")
              : "both";
  const m = h => focus === "cash" ? h.dc : focus === "rep" ? h.dr : h.dc + h.dr;
  let wi = 0; hs.forEach((h, i) => { if (m(h) < m(hs[wi])) wi = i; });
  // "melhor decisão" nunca pode ter custado caro em algum medidor
  let bi = -1; hs.forEach((h, i) => { if (i !== wi && Math.min(h.dc, h.dr) > -15 && (bi < 0 || m(h) > m(hs[bi]))) bi = i; });
  let html = "";
  if (bi >= 0 && m(hs[bi]) > 0)
    html += `<div class="lb good"><span class="lb-k">Your best decision</span><b>${verbWrap(hs[bi].chose)}</b><span class="lb-d">${fmtDelta(hs[bi])}</span></div>`;
  if (m(hs[wi]) < 0)
    html += `<div class="lb bad"><span class="lb-k">Your most expensive mistake</span><b>${verbWrap(hs[wi].chose)}</b><span class="lb-d">${fmtDelta(hs[wi])}</span></div>`;
  return html ? `<p class="lb-t">Looking back <span>· olhando para trás</span></p>` + html : "";
}

}

function chip(group, value, en, pt, on) {

function buildSentence() {
  if (!build || !build.cond || !build.act) return "";
  return `${build.cond}, I ${build.neg ? "wouldn't" : "would"} ${build.act}.`;
}

function checkSentence(s) {
  const t = s.trim(), low = " " + t.toLowerCase().replace(/[’]/g, "'") + " ";
  if (t.split(/\s+/).filter(Boolean).length < 5) return { ok: false, msg: "Write a complete sentence (at least 5 words)." };
  if (!/\bif\b/.test(low)) return { ok: false, msg: "Your sentence needs the word “if”." };
  if (/\bwill\b|\bwon't\b|\w'll\b/.test(low)) return { ok: false, msg: "Use “would”, not “will”. “Will” is for the first conditional." };
  if (!/\bwould\b|\bwouldn't\b|\w'd\b/.test(low)) return { ok: false, msg: "Your sentence needs “would” (or 'd)." };
  // erros típicos de estrutura: a frase não passa, e a dica explica em português
  const SUJ = "(i|you|he|she|it|we|they|my \\w+|our \\w+|the \\w+)";
  if (new RegExp(`\\bif ${SUJ} (would|wouldn't)\\b`).test(low))
    return { ok: false, msg: "Don't use “would” after “if”. · Depois de if vai o passado: If I had..., If I were..., e o would fica na outra parte." };
  const depois = (low.match(/\b(?:would|wouldn't)\s+(?:not\s+)?([a-z']+)/) || [])[1] || "";
  if (depois === "to") return { ok: false, msg: "No “to” after “would”. · Depois de would vem o verbo direto: would buy (não would to buy)." };
  if (/ing$/.test(depois) && !WOULD_OK.has(depois)) return { ok: false, msg: "Use the base form after “would”. · Depois de would, o verbo fica na forma base: would buy (não would buying)." };
  if (PAST_ONLY.has(depois) || (/ed$/.test(depois) && !WOULD_OK.has(depois)))
    return { ok: false, msg: `Use the base form after “would”. · Depois de would, o verbo fica na forma base: ${PAST_TIP(depois)}.` };
  const ifVerb = (low.match(new RegExp(`\\bif ${SUJ} ([a-z']+)`)) || [])[2] || "";
  if (PRESENT.has(ifVerb))
    return { ok: false, msg: `Use the past after “if”. · Na second conditional, o lado do if vai no passado: ${PRESENT_TIP(ifVerb)}.` };
  // dicas: a frase passa, mas o aluno aprende
  const dicas = [];
  if (/\bif (i|he|she|it) was\b/.test(low)) dicas.push("in the second conditional, we usually say “If I were...”");
  if (/^if\b/i.test(t) && !t.includes(",")) dicas.push("when the sentence starts with “If”, use a comma: If I were rich, I would...");
  if (dicas.length) return { ok: true, msg: "Good! Tip: " + dicas.join(" Also, ") + "." };
  return { ok: true, msg: "Looks good! Copy it into your notebook." };
}
// apoio para checkSentence: formas que só existem no passado (went, bought...), verbos que terminam em -ing/-ed
// na forma base (bring, need...) e o presente mais comum depois de if
const WOULD_OK = new Set(["bring", "sing", "ring", "swing", "spring", "string", "need", "feed", "seed", "speed", "bleed", "breed",
  "proceed", "succeed", "exceed", "embed", "shed", "wed", "red", "indeed"]);
const PAST_ONLY = new Map();
IRREG.forEach(([b, p, pp]) => [...p.split(" / "), ...pp.split(" / ")].forEach(f => { if (f !== b && !PAST_ONLY.has(f)) PAST_ONLY.set(f, b); }));
const PAST_TIP = w => PAST_ONLY.has(w) ? `would ${PAST_ONLY.get(w)} (não would ${w})` : `would + o verbo sem -ed (não would ${w})`;
const PRESENT = new Set(["am", "is", "are", "have", "has", "do", "does", "don't", "doesn't", "can", "can't", "want", "wants", "need", "needs", "know", "knows"]);
const PRESENT_TIP = w => ({ am: "If I were (não If I am)", is: "If it were (não If it is)", are: "If we were (não If we are)", have: "If I had (não If I have)",
  has: "If she had (não If she has)", do: "If I did (não If I do)", does: "If he did (não If he does)", "don't": "If I didn't (não If I don't)",
  "doesn't": "If it didn't (não If it doesn't)", can: "If I could (não If I can)", "can't": "If I couldn't (não If I can't)" })[w]
  || `If I ${w.replace(/s$/, "") === "know" ? "knew" : w.replace(/s$/, "") + "ed"} (não If I ${w})`;

/* ---------------- áudio: a voz em inglês que já vem no celular (nada é baixado nem enviado) ---------------- */
const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
let voz = null, falando = null;   // falando: o botão 🔊 que está lendo agora
function escolheVoz() {
  if (!synth) return null;
  const vs = synth.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang));
  // vozes do próprio aparelho primeiro (funcionam sem internet)
  return vs.find(v => v.localService && /en[-_](US|GB)/i.test(v.lang)) || vs.find(v => v.localService) || vs[0] || null;
}
const podeFalar = () => !!(synth && (voz = voz || escolheVoz()));
if (synth) synth.addEventListener("voiceschanged", () => { voz = escolheVoz(); applySettings(); });
// texto que vai para a voz: sem [[glossário]], sem emojis, com o nome da empresa; "go · went" vira "go, went"
const paraFalar = t => String(t).replace(/\[\[([^|\]]+)\|[^\]]+\]\]/g, "$1").replace(/\{name\}/g, (typeof state !== "undefined" && state && state.name) || "")
  .replace(/\p{Extended_Pictographic}|️|‍/gu, "").replace(/\s·\s/g, ", ").replace(/\s+/g, " ").trim();
// divide em frases só onde há pontuação seguida de espaço ("8.5" fica inteiro) e não depois de Mr./Ms./Dr. nem antes de minúscula (“Why?” she asked)
function frases(t) {
  const out = [];
  t.split(/([.!?]+[”"’]?\s+)/).forEach((x, i) => {
    if (i % 2) { out[out.length - 1] += x; return; }
    const ant = out[out.length - 1];
    if (ant !== undefined && (/\b(Mr|Ms|Mrs|Dr)\.\s*$/.test(ant) || /^[a-z]/.test(x))) out[out.length - 1] += x; else out.push(x);
  });
  return out.map(x => x.trim()).filter(Boolean);
}
function fala(texto, botao) {
  if (!podeFalar() || SET.audio === "off") return;
  try {
    synth.cancel(); paraBotao();
    // frase por frase: alguns navegadores cortam leituras longas no meio
    const partes = frases(paraFalar(texto));
    partes.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p);
      u.voice = voz; u.lang = voz.lang; u.rate = SET.audio === "slow" ? 0.7 : 0.95;
      if (botao && i === partes.length - 1) { u.onend = u.onerror = () => { if (falando === botao) paraBotao(); }; }
      synth.speak(u);
    });
    if (botao) { falando = botao; botao.setAttribute("aria-pressed", "true"); botao.querySelector("span").textContent = "Stop · parar"; }
  } catch (e) { /* sem voz: o jogo funciona igual */ }
}
function paraBotao() {
  if (!falando) return;
  falando.setAttribute("aria-pressed", "false");
  const s = falando.querySelector("span"); if (s) s.textContent = "Listen · ouvir";
  falando = null;
}
const sayButton = t => `<button type="button" class="say" data-say="${esc(paraFalar(t))}" aria-pressed="false" aria-label="Listen · ouvir o texto">🔊 <span>Listen · ouvir</span></button>`;
document.addEventListener("click", e => {
  const b = e.target.closest(".say");
  if (!b) return;

  // aparece sempre, mesmo vazio, para o aluno descobrir o recurso
  return `<div class="card" id="w-home"><p class="lb-t" style="margin-top:0">My words <span>· minhas palavras</span></p>
    ${n ? `<p class="hint">${n} ${n === 1 ? "palavra consultada" : "palavras consultadas"} no glossário, guardadas neste aparelho.</p>${reviewButton()}`
         : `<p class="hint">Toque nas palavras sublinhadas durante o jogo: elas ficam guardadas aqui para você revisar depois.</p>`}</div>`;
}

// revisão em cartões, no mesmo painel das configurações (não mexe na partida)
let rv = null;
function openWords() {
  const ws = loadWords().sort((a, b) => (a.ok - b.ok) || (b.t - a.t));   // as que ainda não sabe vêm primeiro
  rv = { deck: ws.slice(0, 10), i: 0, ok: 0, shown: false, armed: false };
  openSheet(wordsHTML());
}
function wordsHTML() {
  const all = loadWords(), head = `<h2 id="st-t">My words <span>· minhas palavras</span></h2>`;
  const done = `<button type="button" class="btn center" id="st-close">Done <span>· pronto</span></button>`;
  if (!all.length) return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st-t">${head}
    <p>Toque nas palavras sublinhadas durante o jogo: elas aparecem aqui para você revisar.</p>${done}</div>`;
  if (rv.i >= rv.deck.length) return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st-t">${head}
    <p class="wscore">You knew ${rv.ok} of ${rv.deck.length}! <span>· você sabia ${rv.ok} de ${rv.deck.length}</span></p>
    <div class="choices"><button type="button" class="btn alt center" id="w-again">Review again <span>· revisar de novo</span></button></div>
    <p class="lb-t">All my words <span>· todas as minhas palavras (${all.length})</span></p>${wordsList(all)}
    <button type="button" class="help-btn" id="w-clear">${rv.armed ? "Tap again to delete <span>· toque de novo para apagar</span>" : "Clear my words <span>· apagar minhas palavras</span>"}</button>
    <div class="choices">${done}</div></div>`;
  const w = rv.deck[rv.i];
  return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st-t">${head}
    <p class="hint">Card ${rv.i + 1} of ${rv.deck.length} · cartão ${rv.i + 1} de ${rv.deck.length}</p>
    <div class="wcard" aria-live="polite"><b>${esc(w.en)}</b>${rv.shown ? `<span>= ${esc(w.pt)}</span>` : `<span class="hint">O que significa? · What does it mean?</span>`}</div>${sayButton(w.en)}
    ${rv.shown ? `<div class="wbtns"><button type="button" class="btn center" id="w-yes">I knew it ✓ <span>· eu sabia</span></button>
      <button type="button" class="btn alt center" id="w-no">Not yet ↻ <span>· ainda não</span></button></div>`
      : `<button type="button" class="btn center" id="w-show">Show the translation <span>· ver a tradução</span></button>`}
    <div class="choices">${done.replace("btn center", "btn alt center")}</div></div>`;
}
function redrawWords(focusId) {
  $("#settings").innerHTML = wordsHTML();
  const f = (focusId && $("#" + focusId)) || $("#settings .sheet button");
  if (f) f.focus();
}
function wordsClick(e) {
  const b = e.target.closest("#w-show, #w-yes, #w-no, #w-again, #w-clear");
  if (!b) return false;
  if (b.id === "w-show") { rv.shown = true; redrawWords("w-yes"); }
  else if (b.id === "w-yes" || b.id === "w-no") {
    const ws = loadWords(), w = ws.find(x => x.k === rv.deck[rv.i].k);
    if (w) { w.ok = b.id === "w-yes" ? w.ok + 1 : 0; saveWords(ws); }
    if (b.id === "w-yes") rv.ok++;
    rv.i++; rv.shown = false; redrawWords("w-show");
  }
  else if (b.id === "w-again") openWords();
  else if (b.id === "w-clear") {
    if (rv.armed) { saveWords([]); rv.armed = false; redrawWords(); }
    else { rv.armed = true; redrawWords("w-clear"); setTimeout(() => { if (rv && rv.armed) { rv.armed = false; if (!$("#settings").hidden && $("#w-clear")) redrawWords("w-clear"); } }, 4000); }
  }
  return true;
}

/* ---------------- glossary popover ---------------- */
document.addEventListener("click", (e) => {
  const tip = $("#tip");
  const g = e.target.closest(".gloss");
  if (!g || !glossOn || (g.classList.contains("a1") && SET.gloss !== "a1")) { tip.classList.remove("on"); return; }
  if (g.classList.contains("verb")) {
    const [b, p, pp, pt] = IRREG[+g.dataset.v];
    const on = g.dataset.c ? g.dataset.c.split(",").map(Number) : [];
    tip.innerHTML = `<div class="vt">${[["infinitive", b], ["past", p], ["participle", pp]].map(([lab, f], i) =>
      `<div class="vc${on.includes(i) ? " on" : ""}"><span>${lab}</span><b>${esc(f)}</b></div>`).join("")}</div><div class="vpt">= ${esc(pt)}</div>`;
    rememberWord("v:" + b, `${b} · ${p} · ${pp}`, pt);
  } else {
    tip.textContent = g.textContent + (g.dataset.base ? ` (${g.dataset.base})` : "") + " = " + g.dataset.pt;
    rememberWord("g:" + wordOf(g), wordOf(g), g.dataset.pt);
  }
  tip.classList.add("on");
  fala(g.textContent);
  const r = g.getBoundingClientRect();
  const left = Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - tip.offsetWidth - 8);
  tip.style.left = Math.max(8, left) + "px";
  // abre acima da palavra (sobre a cena, onde não há botões); só abre abaixo se faltar espaço
  const above = r.top - tip.offsetHeight - 6;
  tip.style.top = (window.scrollY + (above > 8 ? above : r.bottom + 6)) + "px";
});

/* ---------------- glossário: só a 1ª ocorrência de cada palavra por tela ---------------- */
function dedupeGloss() {
  const seen = new Set(), all = [...$("#app").querySelectorAll(".gloss")];
  const word = el => el.textContent.trim().toLowerCase();
  // uma palavra do glossário normal nunca perde a vez para a mesma palavra do nível A1
  const normal = new Set(all.filter(el => !el.classList.contains("a1") && !el.classList.contains("verb")).map(word));
  all.forEach(el => {
    const a1 = el.classList.contains("a1");
    const key = (el.classList.contains("verb") ? "v:" : a1 ? "a:" : "g:") + word(el);
    if (seen.has(key) || (a1 && normal.has(word(el)))) el.replaceWith(...el.childNodes);   // repetida: vira texto comum
    else seen.add(key);
  });
  glossTabs();
}
// palavras do nível A1 só entram na ordem do Tab quando esse nível está ligado
function glossTabs() {
  const on = SET.gloss === "a1";
  document.querySelectorAll(".gloss.a1").forEach(el => { el.tabIndex = on ? 0 : -1; });
}
// roda sempre que a tela muda (inclusive quando o montador de frases se redesenha)
new MutationObserver(dedupeGloss).observe($("#app"), { childList: true, subtree: true });

const pending = loadPending();
if (pending && Array.isArray(pending.history) && ENDINGS[pending.ended]) {
  state = { name: pending.name, deck: [], idx: 0, cash: pending.cash, rep: pending.rep, history: pending.history, ended: pending.ended, saved: true, resumed: true, t0: pending.t0 || Date.now() };
  screenReflect();
} else {
  screenStart();
}
</script>
